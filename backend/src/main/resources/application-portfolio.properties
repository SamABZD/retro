# Public, disposable portfolio demo. A restart rebuilds the fictional data.
spring.application.name=retro
spring.datasource.url=jdbc:h2:mem:retro-portfolio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.seed.enabled=true
app.admin.seed.enabled=false
app.demo.enabled=true
app.cookie.secure=true
app.upload.dir=./uploads/products
app.storage.remote-enabled=false
app.frontend.url=${RETRO_PUBLIC_URL:http://localhost:8080}
app.cors.allowed-origins=${RETRO_PUBLIC_URL:http://localhost:8080}

# Optional integrations are disabled for the self-contained demo.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=demo
spring.mail.password=demo
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.timeout=1000
cloudinary.cloud-name=demo
cloudinary.api-key=demo
cloudinary.api-secret=demo
