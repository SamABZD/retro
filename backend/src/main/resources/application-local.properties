server.port=8080

# Self-contained local database. DataSeeder populates marketplace demo data on startup.
spring.datasource.url=jdbc:h2:file:./data/localmarket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Local-only application settings. Production continues to use environment variables.
app.frontend.url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.cookie.secure=false
app.upload.dir=./uploads/products
app.storage.remote-enabled=false
app.seed.enabled=true
jwt.secret=bG9jYWwtbWFya2V0LWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNi1vbmx5

app.admin.username=admin
app.admin.firstname=Local
app.admin.lastname=Admin
app.admin.email=admin@local.market
app.admin.password=admin12345

# Safe placeholders keep optional integrations constructible during local development.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=local
spring.mail.password=local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.timeout=1000

cloudinary.cloud-name=local
cloudinary.api-key=local
cloudinary.api-secret=local
